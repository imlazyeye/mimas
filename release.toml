# Every crate moves together, so one version covers the whole release.
shared-version = true

# jj keeps git's HEAD detached, so there is no branch for the default allowlist (`["*", "!HEAD"]`) 
# to match -- it excludes `HEAD` by name.
allow-branch = ["*"]

# Handled elsewhere. Off rather than merely unused, so a stray `cargo release <level>` can't
# publish or push a release that was never meant to go out.
publish = false
push = false
tag = false
