[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]
# bevy is huge, so its crate + the examples stay out of the default workspace build. mimas pulls
# crates/bevy in only through its optional `bevy` feature. the book's web repl is its own workspace
# too, since it builds for wasm with its own lockfile.
exclude = ["examples/bevy", "crates/bevy", "tools/book/repl"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/imlazyeye/mimas"
homepage = "https://mim.as"
rust-version = "1.95"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"

# keep file:line in panic backtraces but drop variable-level DWARF -- big cut to debug-info
# generated + linked across the ~24 test binaries, where the dev loop spends its time.
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
glam = { version = "0.32", default-features = false, features = ["std"] }
colored = "2"
pretty_assertions = "1.1"
itertools = "0.10"
rustc-hash = "2"
rand = "0.10"
bitflags = "2"
chompy = "0.5"
indexmap = "2.14.0"
mutants = "0.0.4"
gc-arena = "0.7"
miette = "7.6"
thiserror = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
