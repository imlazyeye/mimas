name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [api, cli, compile, library, macros, mimas, parse, shared, solve, vm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: cargo test --manifest-path crates/${{ matrix.crate }}/Cargo.toml --all-features

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: cargo +nightly fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  bevy-example:
    name: bevy example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/bevy -> target
      - run: cargo clippy --manifest-path examples/bevy/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --manifest-path examples/bevy/Cargo.toml

  all-checks-passed:
    runs-on: ubuntu-latest
    needs:
      [
        test,
        lint,
        bevy-example,
      ]
    if: always()
    steps:
      - name: Decide whether all required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

