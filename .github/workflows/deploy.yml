name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.4.52"
      # http/2 multiplexing intermittently dies on crates.io downloads in ci
      # ("error in the http2 framing layer"); force http/1.1
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # the breakout demo is its own workspace, and misses the cache without this
          workspaces: |
            . -> target
            examples/bevy -> target

      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install mdbook-admonish
        run: cargo install mdbook-admonish --version 1.20.0 --locked

      - name: Install mimas
        run: cargo install --path crates/cli --locked

      - name: Install wasm tooling
        run: |
          rustup target add wasm32-unknown-unknown
          # the cli has to match the crate, or the glue it writes won't load the wasm
          version=$(grep -A1 'name = "wasm-bindgen"$' examples/bevy/Cargo.lock \
            | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: mdbook build book

      # after the book, because `mdbook build` empties `book/book`
      - name: Build the breakout demo
        run: |
          out=book/book/extension/breakout
          cargo build --release --target wasm32-unknown-unknown \
            --manifest-path examples/bevy/Cargo.toml
          wasm-bindgen --target web --no-typescript \
            --out-dir "$out" --out-name breakout \
            examples/bevy/target/wasm32-unknown-unknown/release/bevy.wasm
          wasm-opt -Oz "$out/breakout_bg.wasm" -o "$out/breakout_bg.wasm"
          cp -r examples/bevy/assets "$out/assets"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
