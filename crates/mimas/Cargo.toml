[package]
name = "mimas"
version = "0.3.0"
edition = "2024"
description = "A flexible, statically typed scripting language for Rust."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/mimas"
keywords = ["scripting", "language", "embedded", "gamedev", "interpreter"]
categories = ["compilers", "game-development"]

[lib]
name = "mimas"

[dependencies]
api = { package = "mimas-api", path = "../api", version = "0.3.0" }
compile = { package = "mimas-compile", path = "../compile", version = "0.3.0" }
library = { package = "mimas-library", path = "../library", version = "0.3.0" }
macros = { package = "mimas-macros", path = "../macros", version = "0.3.0" }
parse = { package = "mimas-parse", path = "../parse", version = "0.3.0" }
shared = { package = "mimas-shared", path = "../shared", version = "0.3.0" }
solve = { package = "mimas-solve", path = "../solve", version = "0.3.0" }
vm = { package = "mimas-vm", path = "../vm", version = "0.3.0" }
mimas-bevy = { path = "../bevy", version = "0.3.0", optional = true }

[features]
op-count = ["vm/op-count"]
bevy = ["dep:mimas-bevy"]
export-api = ["vm/export-api"]
default = ["export-api"]

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "vm_benches"
harness = false

# Promote the accumulated notes into a dated section, leave a fresh `## [Unreleased]` behind
# for the next cycle, and add the link reference the new heading needs. This lives on one crate
# because release.toml applies to every crate, each looking for `file` in its own folder.
[package.metadata.release]
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "../../CHANGELOG.md", search = "<!-- next-release -->", replace = "<!-- next-release -->\n[{{version}}]: https://github.com/imlazyeye/mimas/releases/tag/v{{version}}", exactly = 1 },
]
