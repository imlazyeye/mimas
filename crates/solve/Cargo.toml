[package]
name = "mimas-solve"
version = "0.3.0"
edition = "2024"
description = "Type solver and checker for the mimas language. Internal to mimas; not intended for direct use."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "solve"
path = "src/lib.rs"

[dependencies]
shared = { package = "mimas-shared", path = "../shared", version = "0.3.0" }
parse = { package = "mimas-parse", path = "../parse", version = "0.3.0" }
api = { package = "mimas-api", path = "../api", version = "0.3.0" }
chompy.workspace = true
colored.workspace = true
itertools.workspace = true
bitflags.workspace = true
indexmap.workspace = true
mutants.workspace = true
miette.workspace = true
thiserror.workspace = true

[features]
logging = []

[dev-dependencies]
pretty_assertions.workspace = true
