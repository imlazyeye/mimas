[package]
name = "mimas-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for the mimas language (the `#[mimas]` attribute). Internal to mimas; not intended for direct use."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "macros"
path = "src/lib.rs"
proc-macro = true
# this crate has zero tests; opting out of the empty unit-test harness stops cargo from
# building a test executable that has no rpath set, which trips dyld on macos when older
# test runners (e.g. older cargo-nextest) don't set DYLD_FALLBACK_LIBRARY_PATH for it.
test = false

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
proc-macro-crate = "3"
