[package]
name = "mimas-api"
version = "0.2.0"
edition = "2024"
description = "Shared API definitions for the mimas language. Internal to mimas; not intended for direct use."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[dependencies]
shared = { package = "mimas-shared", path = "../shared", version = "0.2.0" }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
walkdir.workspace = true

[features] 
serde = ["dep:serde", "dep:serde_json", "shared/serde"]