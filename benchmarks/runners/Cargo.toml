[package]
name = "bench-runners"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
mimas = { path = "../../crates/mimas" }
# all perf options except keeping ints at i64 for parity
rhai = { version = "=1.26.0", features = ["unchecked", "no_closure", "no_module", "no_position", "no_custom_syntax"] }
rune = "=0.14.2"
mlua = { version = "=0.12.0", features = ["luau"] }
koto = "=0.16.1"
dyon = "=0.51.2"
steel-core = "=0.8.3"
boa_engine = "=0.22.0"
boa_runtime = "=0.22.0"
rustpython-vm = "=0.5.0"
rustpython-stdlib = "=0.5.0"
fabricator-vm = { git = "https://github.com/kyren/fabricator" }
fabricator-compiler = { git = "https://github.com/kyren/fabricator" }
fabricator-stdlib = { git = "https://github.com/kyren/fabricator" }
roto = { git = "https://codeberg.org/NLnetLabs/roto", rev = "dd310da7ba326c90745edc9fd44fdffa5b3eb378", default-features = false }

[[bin]]
name = "mimas-run"
path = "src/mimas_run.rs"

[[bin]]
name = "rhai-run"
path = "src/rhai_run.rs"

[[bin]]
name = "rune-run"
path = "src/rune_run.rs"

[[bin]]
name = "luau-run"
path = "src/luau_run.rs"

[[bin]]
name = "koto-run"
path = "src/koto_run.rs"

[[bin]]
name = "dyon-run"
path = "src/dyon_run.rs"

[[bin]]
name = "steel-run"
path = "src/steel_run.rs"

[[bin]]
name = "boa-run"
path = "src/boa_run.rs"

[[bin]]
name = "rustpython-run"
path = "src/rustpython_run.rs"

[[bin]]
name = "gml-run"
path = "src/gml_run.rs"

[[bin]]
name = "roto-run"
path = "src/roto_run.rs"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
