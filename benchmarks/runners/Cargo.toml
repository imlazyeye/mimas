[package]
name = "bench-runners"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
mimas = { path = "../../crates/mimas" }
# all perf options except keeping ints at i64 for parity
rhai = { version = "=1.26.0", features = ["unchecked", "no_closure", "no_module", "no_position", "no_custom_syntax"] }
rune = "=0.14.2"
# held at 0.11.4 deliberately: 0.12 bundles a newer Luau whose gains we haven't analysed yet.
# the legend reports whichever version is in the lockfile, so this stays honest -- revisit and
# re-measure against current Luau after 0.1.0.
mlua = { version = "=0.11.4", features = ["luau"] }
koto = "=0.16.1"
dyon = "=0.51.2"
steel-core = "=0.8.3"
boa_engine = "=0.22.0"
boa_runtime = "=0.22.0"
rustpython-vm = "=0.5.0"
rustpython-stdlib = "=0.5.0"
fabricator-vm = { git = "https://github.com/kyren/fabricator" }
fabricator-compiler = { git = "https://github.com/kyren/fabricator" }
fabricator-stdlib = { git = "https://github.com/kyren/fabricator" }

[[bin]]
name = "mimas-run"
path = "src/mimas_run.rs"

[[bin]]
name = "rhai-run"
path = "src/rhai_run.rs"

[[bin]]
name = "rune-run"
path = "src/rune_run.rs"

[[bin]]
name = "luau-run"
path = "src/luau_run.rs"

[[bin]]
name = "koto-run"
path = "src/koto_run.rs"

[[bin]]
name = "dyon-run"
path = "src/dyon_run.rs"

[[bin]]
name = "steel-run"
path = "src/steel_run.rs"

[[bin]]
name = "boa-run"
path = "src/boa_run.rs"

[[bin]]
name = "rustpython-run"
path = "src/rustpython_run.rs"

[[bin]]
name = "gml-run"
path = "src/gml_run.rs"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
