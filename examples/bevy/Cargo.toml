[package]
name = "bevy"
version = "0.2.0"
edition = "2024"
description = "A breakout game scripted in mimas through its `bevy` feature."
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[dependencies]
mimas = { path = "../../crates/mimas", features = ["bevy"] }
bevy = { version = "0.19.1", default-features = false, features = ["2d"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["file_watcher"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["web", "webgl2"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# the demo ships in the book, where the download is what matters, not the frame rate
[profile.release]
opt-level = "z"
strip = true
