[package]
name = "lunacade"
version = "0.3.0"
edition = "2024"
description = "lunacade, a fantasy console for mimas, as the page in the book drives it."
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

# the rlib is for the tests, which call the exports natively
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lunacade-core = { path = "../core" }
# the analysis alone, without the stdio server
lsp = { package = "mimas-lsp", path = "../../../crates/lsp", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the same version examples/bevy locks, since deploy.yml installs one wasm-bindgen cli for all of them
wasm-bindgen = "=0.2.128"
