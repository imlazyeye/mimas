[package]
name = "lunacade-core"
version = "0.3.0"
edition = "2024"
description = "lunacade, a fantasy console for mimas, without a window: its machine, screen and cart format."
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[dependencies]
mimas = { path = "../../../crates/mimas", default-features = false, features = ["export-api"] }
host = { package = "mimas-api", path = "../../../crates/api" }
solve = { package = "mimas-solve", path = "../../../crates/solve" }
parse = { package = "mimas-parse", path = "../../../crates/parse" }
shared = { package = "mimas-shared", path = "../../../crates/shared" }
serde = { version = "1", features = ["derive"] }
glam = { version = "0.32", default-features = false, features = ["std"] }

# std's rand wants an entropy source, and the web has to be told where it is
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
rand = "0.10"
serde_json = "1"
